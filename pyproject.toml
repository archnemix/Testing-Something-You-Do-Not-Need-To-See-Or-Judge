[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-cognitive-system"
version = "0.1.0"
description = "A small, language-model-free symbolic cognitive architecture experiment"
requires-python = ">=3.11"

[project.optional-dependencies]
train = ["numpy>=1.26", "torch>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]
